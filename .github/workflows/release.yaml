name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Discover Services
  #
  # The workspace contains the first service (the root package) plus one
  # package per directory under services/. Vendored crates (crates/*,
  # including service-core and axum-cloudevents*) are never images. Discovery
  # is delegated to scripts/list-services.sh, which reads
  # `cargo metadata --no-deps` and selects packages by manifest path.
  # ==========================================================================
  discover:
    name: Discover Services
    runs-on: marrakesh-runner
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      pull_commands: ${{ steps.discover.outputs.pull_commands }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install discovery dependencies
        run: |
          # scripts/list-services.sh parses `cargo metadata` with python3; the
          # ARC runner image does not guarantee it (GitHub-hosted Ubuntu does).
          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3
          fi

      - name: Discover workspace services
        id: discover
        env:
          GITHUB_ORG: enchantednatures
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          # scripts/list-services.sh prints <slug>\t<dir>\t<package>\t<bin> for
          # the root package and every services/* workspace member; --json
          # returns the same rows as an array.
          rows = json.loads(
              subprocess.check_output(
                  ["bash", "scripts/list-services.sh", "--json"], text=True
              )
          )
          if not rows:
              raise SystemExit("no services discovered in the workspace")

          registry = os.environ["REGISTRY"]
          org = os.environ["GITHUB_ORG"]
          ref_name = os.environ.get("REF_NAME", "")
          version = ref_name[1:] if ref_name.startswith("v") else ref_name
          # rows[0] is always the first service (the root package).
          project = rows[0]["slug"]

          include = []
          images = []
          for row in rows:
              is_root = row["dir"] == "."
              image = (
                  "{}/{}/{}".format(registry, org, project)
                  if is_root
                  else "{}/{}/{}-{}".format(registry, org, project, row["slug"])
              )
              include.append(
                  {
                      "service": row["slug"],
                      "dir": row["dir"],
                      "pkg": row["package"],
                      "bin": row["bin"],
                      "image": image,
                  }
              )
              images.append(image)

          matrix = {"include": include}
          print("matrix=" + json.dumps(matrix))
          print("pull_commands<<PULL_COMMANDS")
          for image in images:
              print("docker pull {}:{}".format(image, version))
          print("PULL_COMMANDS")
          PY

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  create-release:
    name: Create Release
    runs-on: marrakesh-runner
    needs: discover
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Release ${{ steps.get_version.outputs.version }}

            ### Container Images

            ```bash
            ${{ needs.discover.outputs.pull_commands }}
            ```

            ### Deployment

            This release is automatically deployable via Flux ImagePolicy using the `release` policy.

            See the [deployment documentation](../docs/DEPLOYMENT.md) for details.
          draft: false
          prerelease: false

  # ==========================================================================
  # Build & Push Release Images (one per service)
  # ==========================================================================
  build-release:
    name: Build Release Image (${{ matrix.service }})
    runs-on: marrakesh-runner
    needs: [create-release, discover]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Docker daemon
        run: |
          # The DinD sidecar's TLS setup can lag the runner container; wait
          # for the daemon before any docker/buildx step.
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker info
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            # SemVer tags (v1.0.0 -> 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Release tag for ImagePolicy
            type=raw,value=release
            # Git SHA for traceability
            type=sha,prefix=sha-,format=short

      - name: Build and push release image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The same Dockerfile builds every workspace member; the build args
          # select the service directory, cargo package and binary.
          build-args: |
            SERVICE_DIR=${{ matrix.dir }}
            SERVICE_PKG=${{ matrix.pkg }}
            SERVICE_BIN=${{ matrix.bin }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            cargo_token=${{ secrets.KELLNR_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64
          # NOTE: `rust:release` does not exist on Docker Hub; the Dockerfile's
          # RUST_BASE_IMAGE_TAG default (kept in sync by renovate) is used.

      - name: Image digest
        run: |
          echo "Release image built and pushed:"
          echo "Service: ${{ matrix.service }}"
          echo "Image: ${{ matrix.image }}"
          echo "Version: ${{ needs.create-release.outputs.version }}"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: Save image digest
        run: |
          mkdir -p .digests
          echo "${{ steps.build-push.outputs.digest }}" > ".digests/${{ matrix.service }}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: .digests/
          retention-days: 1

  # ==========================================================================
  # Security Scan (one per service)
  # ==========================================================================
  security-scan:
    name: Security Scan (${{ matrix.service }})
    runs-on: marrakesh-runner
    needs: [discover, build-release]
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download image digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: .digest

      - name: Read image digest
        id: digest
        run: echo "value=$(cat .digest/${{ matrix.service }})" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.digest.outputs.value }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        # SARIF ingestion via code scanning needs GitHub Advanced Security,
        # which is unavailable on many repos (including private ones); ship
        # the report as a build artifact instead.
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ matrix.service }}
          path: trivy-results.sarif

      - name: Fail on vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.digest.outputs.value }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
