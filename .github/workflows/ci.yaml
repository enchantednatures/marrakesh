name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Quality Gates - Lint & Format
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: marrakesh-runner
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          # The ARC runner image is minimal; the crates need a C linker and
          # the rdkafka `cmake-build` feature needs cmake at compile time.
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake libcurl4-openssl-dev libsasl2-dev libzstd-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ==========================================================================
  # Quality Gates - Tests
  # ==========================================================================
  test:
    name: Test
    runs-on: marrakesh-runner
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake libcurl4-openssl-dev libsasl2-dev libzstd-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      
      - name: Cache RustFS client
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/rc
          key: rustfs-cli-0.1.36-${{ runner.os }}

      - name: Wait for Docker daemon
        run: |
          # The DinD sidecar's TLS setup can lag the runner container; wait
          # for the daemon before any docker/buildx step.
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker info
          exit 1

      - name: Start Redis
        run: |
          # ARC kubernetes-mode runners do not support GitHub service
          # containers; run Redis on the pod's DinD daemon instead (the
          # runner and dind share the pod network namespace, so the
          # published port is reachable on localhost).
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec redis redis-cli ping

      - name: Start RustFS
        run: |
          # S3-compatible object storage for the storage tests. Started
          # imperatively because GH service containers cannot pass the
          # "server /data" style command the image needs.
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin \
            -e RUSTFS_SECRET_KEY=rustfsadmin \
            rustfs/rustfs:1.0.1 /data
          for i in $(seq 1 60); do
            curl -fsS http://localhost:9000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:9000/health >/dev/null

      - name: Initialize RustFS bucket
        run: |
          command -v rc >/dev/null 2>&1 || cargo install rustfs-cli --version 0.1.36
          rc alias set local http://localhost:9000 rustfsadmin rustfsadmin
          rc bucket create -p local/data
      
      - name: Run tests
        run: cargo test --all-features
        env:
          APP__REDIS__URL: redis://localhost:6379
          
          APP__S3__ENDPOINT: http://localhost:9000
          APP__S3__BUCKET: data
          APP__S3__REGION: us-east-1
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          

  
  # ==========================================================================
  # Manifest Validation - overlays must reference the configured Prometheus
  # per environment (see docs/FLAGGER.md "Prerequisites")
  # ==========================================================================
  manifests:
    name: Validate manifests
    runs-on: marrakesh-runner
    steps:
      - uses: actions/checkout@v6

      - name: Verify per-env canary gate addresses in overlays
        run: |
          set -euo pipefail
          grep -Fq "http://prometheus.observability.svc.cluster.local:9090" deploy/overlays/staging/kustomization.yaml \
            || { echo "staging overlay does not reference the configured staging Prometheus"; exit 1; }
          grep -Fq "http://prometheus.observability.svc.cluster.local:9090" deploy/overlays/prod/kustomization.yaml \
            || { echo "prod overlay does not reference the configured prod Prometheus"; exit 1; }
  

  # ==========================================================================
  # Build & Push Docker Image
  # ==========================================================================
  build:
    name: Build & Push
    runs-on: marrakesh-runner
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Wait for Docker daemon
        run: |
          # The DinD sidecar's TLS setup can lag the runner container; wait
          # for the daemon before any docker/buildx step.
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker info
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Git SHA short (for Flux ImagePolicy)
            type=sha,prefix=sha-,format=short
            # Timestamp (for ordering)
            type=raw,value=ts-{{date 'YYYYMMDDHHmmss'}}
            # Branch name
            type=ref,event=branch
            # SemVer tags (v1.0.0 -> 1.0.0, latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Latest for main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: |
          echo "Image built and pushed:"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ==========================================================================
  # Security Scan (Optional)
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: marrakesh-runner
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
