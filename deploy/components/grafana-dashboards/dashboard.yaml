
apiVersion: v1
kind: ConfigMap
metadata:
  name: marrakesh-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: marrakesh
    app.kubernetes.io/component: observability
  annotations:
    # Honored when the Grafana sidecar sets FOLDER_ANNOTATION=grafana_folder
    # (kube-prometheus-stack); the dev sidecar ignores it and uses its provider
    # folder instead.
    grafana_folder: Apps
