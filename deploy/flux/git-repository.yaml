apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: marrakesh
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/enchantednatures/marrakesh.git
  ref:
    branch: main
  # Private repository: SSH deploy key living in `marrakesh-git-auth`
  # (identity / identity.pub / known_hosts), created by the bootstrap step
  # (see deploy/flux/bootstrap/github-deploy-key.sops.yaml).
  secretRef:
    name: marrakesh-git-auth
