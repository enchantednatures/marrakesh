apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: marrakesh
  namespace: flux-system
spec:
  interval: 1m
  # Private repositories pull over SSH with a deploy key stored in the
  # `git_auth_secret` Secret (identity / identity.pub / known_hosts);
  # create it with `make git-auth`. Public repositories use HTTPS.
  url: ssh://git@github.com/enchantednatures/marrakesh.git
  ref:
    branch: main
  secretRef:
    name: marrakesh-git-auth
  
