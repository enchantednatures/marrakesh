apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: marrakesh-runner
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/infrastructure/gha-runner
  prune: true
  sourceRef:
    kind: GitRepository
    name: marrakesh
  wait: true
  timeout: 5m
  # No dependsOn on `actions-runner-controller`: the ARC controller is
  # installed cluster-wide from the HomeCluster repo (cluster-operators),
  # not via a Kustomization managed by this repository.
