apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: marrakesh-runner
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/infrastructure/gha-runner
  prune: true
  sourceRef:
    kind: GitRepository
    name: marrakesh
  wait: true
  timeout: 5m
  dependsOn:
    - name: actions-runner-controller
