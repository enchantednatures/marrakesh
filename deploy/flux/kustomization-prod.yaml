apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: marrakesh-prod
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: marrakesh
  wait: true
  timeout: 5m
  
  dependsOn:
    
    - name: flagger
    
    
    # CNPG operator (cluster-wide) must be ready before the overlay's postgres
    # component (Cluster/ObjectStore/ScheduledBackup CRs) is applied.
    - name: cnpg-operator
    
  
  
  # The overlay renders the CloudNativePG Cluster via deploy/components/postgres;
  # gate readiness on it. The namespace must match the overlay's `namespace:`
  # field (kustomize overrides every resource namespace with it).
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: "marrakesh-postgres"
      namespace: marrakesh
  # The backup bucket is provisioned by the chart (ObjectBucketClaim) and its
  # credentials come from the provisioner-created Secret
  # `<project>-postgres-backups`, consumed by the CNPG ObjectStore. SOPS
  # decryption is retained for user-managed secrets; it requires an `sops-age`
  # secret in the flux-system namespace on the target cluster.
  # Prerequisites: the lib-bucket-provisioner CRDs (installed by Rook) and a
  # bucket StorageClass with `reclaimPolicy: Retain`.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  
