apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: marrakesh-dev
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: marrakesh
  wait: true
  timeout: 5m

  # NOTE: no dependsOn on `flagger` / `cnpg-operator` here. On the home
  # cluster those operators are installed cluster-wide from the HomeCluster
  # repo (cluster-operators Kustomization), so this repo only ships the
  # application and would otherwise fight the existing HelmReleases.

  # The overlay renders the CloudNativePG Cluster via deploy/components/postgres;
  # gate readiness on it. The namespace must match the overlay's `namespace:`
  # field (kustomize overrides every resource namespace with it).
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: "marrakesh-postgres"
      namespace: marrakesh
  # SOPS decryption for the committed sops-encrypted secrets
  # (deploy/overlays/dev/ghcr-pull-secret.sops.yaml, deploy/flux/bootstrap/).
  # Requires an `sops-age` secret in the flux-system namespace (present on the
  # home cluster).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
