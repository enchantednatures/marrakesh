apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marrakesh

resources:
  - ../../base
  
  - namespace.yaml
  

components:
  
  - ../../components/flagger
  
  
  - ../../components/postgres
  

patches:
  - target:
      kind: HelmRelease
      name: marrakesh
    patch: |-
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          minScale: 2
          maxScale: 20
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"

      
      # Chart-provisioned ObjectBucketClaims (ksvc 1.0.0 `objectBuckets`). The
      # cluster bucket provisioner creates the bucket plus a claim-named Secret
      # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) and ConfigMap
      # (BUCKET_HOST/BUCKET_PORT/BUCKET_NAME) in the release namespace.
      - op: add
        path: /spec/values/objectBuckets
        value:
          
          postgres-backups:
            storageClassName: "ceph-bucket"
            endpointURL: "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
            bucketName: "marrakesh-postgres-backups-prod"
          
          
          app-data:
            storageClassName: "ceph-bucket"
            bucketName: "marrakesh-app-data-prod"
            
          
      

      
      
      - op: replace
        path: /spec/values/kafka/sources/events/consumers
        value: 10
      - op: replace
        path: /spec/values/kafka/sources/events/initialOffset
        value: latest
      - op: replace
        path: /spec/values/kafka/sources/events/delivery/retry
        value: 10
      - op: replace
        path: /spec/values/kafka/sources/events/delivery/backoffDelay
        value: "PT2S"
      

  
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "marrakesh-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 3
  # Per-env backup retention (ObjectStore base carries the prod default).
  # The base carries the dev/Kind RustFS endpoint; prod routes backups to the
  # Ceph RGW bucket provisioned by the chart (see the objectBuckets patch).
  - target:
      kind: ObjectStore
      name: "marrakesh-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "30d"
      - op: replace
        path: /spec/configuration/endpointURL
        value: "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
      - op: replace
        path: /spec/configuration/destinationPath
        value: "s3://marrakesh-postgres-backups-prod/"
  
  
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "marrakesh-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 4
  


  
  # Canary metric gates must query THIS environment's Prometheus. The flagger
  # component's fallback (dev observability URL) does not exist here.
  # See docs/FLAGGER.md "Prerequisites".
  - target:
      kind: MetricTemplate
    patch: |-
      - op: replace
        path: /spec/provider/address
        value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  
