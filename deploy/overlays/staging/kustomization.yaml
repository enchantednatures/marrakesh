apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marrakesh

resources:
  - ../../base
  
  - namespace.yaml
  

components:
  
  - ../../components/flagger
  
  
  - ../../components/postgres
  

patches:
  - target:
      kind: HelmRelease
      name: marrakesh
    patch: |-
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          minScale: 1
          maxScale: 5
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "800m"
            memory: "384Mi"

      
      
      - op: replace
        path: /spec/values/kafka/sources/events/consumers
        value: 5
      - op: replace
        path: /spec/values/kafka/sources/events/initialOffset
        value: earliest
      

  
  # Object buckets provisioned per environment by the chart (ObjectBucketClaim).
  # Names are immutable once a claim first binds; keep them environment-unique.
  - target:
      kind: HelmRelease
      name: marrakesh
    patch: |-
      - op: add
        path: /spec/values/objectBuckets
        value:
          
          postgres-backups:
            storageClassName: "ceph-bucket"
            endpointURL: "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
            bucketName: "marrakesh-postgres-backups-staging"
          
          
          app-data:
            storageClassName: "ceph-bucket"
            bucketName: "marrakesh-app-data-staging"
            
          
  

  
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "marrakesh-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
  # Per-env backup retention (ObjectStore base carries the prod default).
  - target:
      kind: ObjectStore
      name: "marrakesh-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "14d"
  # Point backups at THIS environment's Ceph RGW bucket (base carries the
  # dev/Kind RustFS endpoint and the un-suffixed destination path).
  - target:
      kind: ObjectStore
      name: "marrakesh-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/configuration/endpointURL
        value: "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
      - op: replace
        path: /spec/configuration/destinationPath
        value: "s3://marrakesh-postgres-backups-staging/"
  
  
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "marrakesh-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
  


  
  # Canary metric gates must query THIS environment's Prometheus. The flagger
  # component's fallback (dev observability URL) does not exist here.
  # See docs/FLAGGER.md "Prerequisites".
  - target:
      kind: MetricTemplate
    patch: |-
      - op: replace
        path: /spec/provider/address
        value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  
