apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: console
  namespace: marrakesh
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: console
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: redpanda-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    service:
      type: ClusterIP
    config:
      kafka:
        brokers:
          - marrakesh-kafka:9093
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
