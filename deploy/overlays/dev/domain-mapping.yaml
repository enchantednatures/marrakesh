
# Expose the Knative service on marrakesh.enchantednatures.com. The ClusterDomainClaim is
# only required on clusters that disable Knative's automatic domain claims
# (config-domain `autoCreateClusterDomainClaim: "false"`); drop the claim on
# clusters that create claims automatically.
apiVersion: networking.internal.knative.dev/v1alpha1
kind: ClusterDomainClaim
metadata:
  name: marrakesh.enchantednatures.com
spec:
  namespace: marrakesh
---
apiVersion: serving.knative.dev/v1beta1
kind: DomainMapping
metadata:
  name: marrakesh.enchantednatures.com
  namespace: marrakesh
spec:
  ref:
    name: marrakesh
    kind: Service
    apiVersion: serving.knative.dev/v1

