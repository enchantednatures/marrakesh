apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marrakesh

resources:
  - ../../base
  # Added services register their self-contained per-environment deploy
  # subtree here (written by `make add-service`):
  # - ../../../services/<service>/deploy/overlays/dev
  - namespace.yaml
  # Kyverno generates a default-deny NetworkPolicy into every new namespace;
  # app namespaces on this cluster ship an allow-all policy to lift it.
  - networkpolicy.yaml
  # Public exposure: the cluster's wildcard Cloudflare tunnel forwards
  # *.enchantednatures.com to the istio ingress gateways; the DomainMapping
  # gives the ksvc a route on knative-ingress-gateway for that host. This
  # cluster runs Knative with ClusterDomainClaims (no auto-create), so the
  # claim is part of the manifest too.
  - domain-mapping.yaml
  - ghcr-pull-secret.sops.yaml
  # Redpanda Console for the app's managed Kafka (marrakesh-kafka:9093).
  - console.yaml
  - console-virtualservice.yaml

components:
  - ../../components/postgres
  - ../../components/postgres-pooler

patches:
  - target:
      kind: HelmRelease
      name: marrakesh
    # JSON6902 throughout: the app env list must be REPLACED wholesale (a
    # strategic merge would name-merge it with the base entries), and the
    # same style is kept for the rest of the values.
    patch: |-
      - op: replace
        path: /spec/values/services/app/image
        value:
          repository: "ghcr.io/enchantednatures/marrakesh"
          # CI-built sha-<commit> for the template-sync merge. The cluster's
          # Kyverno disallow-latest-tag policy requires a pinned tag.
          tag: "sha-61e5b61"
          imagePullSecrets:
            - name: ghcr-pull-secret
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          # Scale-to-zero; cold starts are acceptable for this service.
          minScale: 0
          maxScale: 3
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      # Replaces the base env list; must keep every entry the app needs.
      # Backends: chart-managed Dragonfly (cache), chart-provisioned Ceph RGW
      # bucket (S3), Tempo (OTLP), chart-managed Redpanda (Kafka), CNPG via
      # the PgBouncer pooler.
      - op: replace
        path: /spec/values/services/app/env
        value:
          - name: APP_ENV
            value: "development"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            value: "redis://marrakesh-dragonfly.marrakesh.svc.cluster.local:6379"
          # Object storage comes from the chart-provisioned ObjectBucketClaim
          # "marrakesh-app-data" (see the objectBuckets patch below). The
          # cluster bucket provisioner publishes the credentials Secret and
          # the bucket identity ConfigMap under the claim name, in this
          # namespace.
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: "marrakesh-app-data"
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "marrakesh-app-data"
                key: AWS_SECRET_ACCESS_KEY
          # BUCKET_HOST/BUCKET_PORT must be declared BEFORE APP__S3__ENDPOINT:
          # Kubernetes expands $(VAR) references using earlier entries only.
          - name: BUCKET_HOST
            valueFrom:
              configMapKeyRef:
                name: "marrakesh-app-data"
                key: BUCKET_HOST
          - name: BUCKET_PORT
            valueFrom:
              configMapKeyRef:
                name: "marrakesh-app-data"
                key: BUCKET_PORT
          - name: APP__S3__ENDPOINT
            value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
          - name: APP__S3__BUCKET
            valueFrom:
              configMapKeyRef:
                name: "marrakesh-app-data"
                key: BUCKET_NAME
          - name: APP__S3__REGION
            value: "us-east-1"
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://tempo-distributor.monitoring.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "marrakesh"
          - name: APP__TELEMETRY__LOG_LEVEL
            value: "debug"
          - name: RUST_LOG
            value: "debug,hyper=info,tower=info"
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "marrakesh-postgres-app"
                key: uri
          # Route the sqlx pool through the PgBouncer Pooler service instead
          # of <cluster>-rw (host swap only; credentials come from the URI).
          - name: APP__POSTGRES__HOST
            value: "marrakesh-postgres-rw-pooler"
          # Managed Redpanda: the chart publishes the internal listener on
          # port 9093 (not the external 9092).
          - name: APP__KAFKA__BROKER_URL
            value: "marrakesh-kafka:9093"
      # Dedicated Dragonfly cache rendered by the ksvc chart (Dragonfly CR
      # named marrakesh-dragonfly; the operator creates the matching Service).
      # The base HelmRelease declares `dragonfly.enabled: false`; replace the
      # object to turn it on with this environment's sizing.
      - op: replace
        path: /spec/values/dragonfly
        value:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          snapshot:
            enabled: false
          pdb:
            minAvailable: 0
            maxUnavailable: 1
      - op: replace
        path: /spec/values/kafka/sources/events/consumers
        value: 1
      - op: replace
        path: /spec/values/kafka/sources/events/initialOffset
        value: earliest

  # Ceph RGW buckets provisioned by the chart (ksvc `objectBuckets`). The
  # home cluster runs the Rook bucket provisioner and the `ceph-bucket*`
  # StorageClasses, so each claim binds to a real bucket and publishes a
  # claim-named Secret (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) plus a
  # ConfigMap (BUCKET_HOST/BUCKET_PORT/BUCKET_NAME) in this namespace.
  # The Kind overlay clears this map and falls back to its in-cluster RustFS.
  - target:
      kind: HelmRelease
      name: marrakesh
    patch: |-
      - op: add
        path: /spec/values/objectBuckets
        value:
          postgres-backups:
            # Retain so pruning the claim can never destroy backups.
            storageClassName: "ceph-bucket-retain"
            endpointURL: "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
            bucketName: "marrakesh-postgres-backups"
          app-data:
            storageClassName: "ceph-bucket"
            bucketName: "marrakesh-app-data"

  # Per-env CloudNativePG sizing (the component base carries prod-leaning
  # defaults). The base already carries pod resources and the ceph-block
  # StorageClass, so only the instance count and Barman layout are patched.
  - target:
      kind: Cluster
      name: "marrakesh-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      # Per-server prefix inside the dedicated backup bucket (barman layout).
      - op: add
        path: /spec/plugins/0/parameters/serverName
        value: "marrakesh-v1"

  # Backups go to the chart-provisioned Ceph RGW bucket
  # (marrakesh-postgres-backups); credentials come from the claim-named
  # Secret, so the base s3Credentials reference is kept.
  - target:
      kind: ObjectStore
      name: "marrakesh-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/configuration/endpointURL
        value: "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
      - op: replace
        path: /spec/configuration/destinationPath
        value: "s3://marrakesh-postgres-backups/"
      - op: replace
        path: /spec/retentionPolicy
        value: "7d"

  # PgBouncer pooler instance count plus the cluster-wide istio
  # dataplane-mode label the other poolers carry. The base already carries the
  # pgbouncer container resources required by Kyverno.
  - target:
      kind: Pooler
      name: "marrakesh-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: add
        path: /spec/template/metadata
        value:
          labels:
            istio.io/dataplane-mode: none
