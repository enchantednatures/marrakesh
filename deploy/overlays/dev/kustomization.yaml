apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

components:
  
  - ../../components/postgres
  
  
  - ../../components/postgres-pooler
  

patches:
  - target:
      kind: HelmRelease
      name: marrakesh
    # JSON6902 instead of a strategic-merge patch: kustomize >= 5.4 rejects the
    # empty-string `services.""` key during strategic merges (repository issue
    # #136). RFC 6901 encodes the empty member as an empty path segment
    # (double slash), which kustomize's JSON6902 implementation supports.
    patch: |-
      - op: replace
        path: /spec/values/services//image
        value:
          repository: "kind-registry-dev:5000/marrakesh"
          tag: "dev"
      - op: replace
        path: /spec/values/services//scaling
        value:
          minScale: 0
          maxScale: 3
      - op: replace
        path: /spec/values/services//resources
        value:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      # Replaces the base env list; must keep every base entry the app needs,
      # including the gated S3 and PostgreSQL values.
      - op: replace
        path: /spec/values/services//env
        value:
          - name: APP_ENV
            value: "development"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            value: "redis://redis.redis.svc.cluster.local:6379"
          
          - name: APP__S3__ENDPOINT
            value: "http://rustfs.rustfs.svc.cluster.local:9000"
          - name: APP__S3__BUCKET
            value: "data"
          - name: APP__S3__REGION
            value: "us-east-1"
          - name: AWS_ACCESS_KEY_ID
            value: "rustfsadmin"
          - name: AWS_SECRET_ACCESS_KEY
            value: "rustfsadmin"
          
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "marrakesh-dev"
          - name: APP__TELEMETRY__LOG_LEVEL
            value: "debug"
          - name: RUST_LOG
            value: "debug,hyper=info,tower=info"
          
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "marrakesh-postgres-app"
                key: uri
          
          
          - name: APP__KAFKA__BROKER_URL
            value: "kafka.kafka.svc.cluster.local:9092"
          

      
      - op: replace
        path: /spec/values/kafka/sources/events
        value:
          bootstrapServers:
            - "kafka.kafka.svc.cluster.local:9092"
          consumers: 1
          initialOffset: earliest
      

  
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "marrakesh-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
  # Per-env backup retention (ObjectStore base carries the prod default).
  - target:
      kind: ObjectStore
      name: "marrakesh-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "7d"
  
  
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "marrakesh-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
  

