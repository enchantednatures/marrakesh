apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marrakesh

resources:
  - ../../base
  - namespace.yaml
  # Kyverno generates a default-deny NetworkPolicy into every new namespace;
  # app namespaces on this cluster ship an allow-all policy to lift it.
  - networkpolicy.yaml
  # Public exposure: the cluster's wildcard Cloudflare tunnel forwards
  # *.enchantednatures.com to the istio ingress gateways; the DomainMapping
  # gives the ksvc a route on knative-ingress-gateway for that host. This
  # cluster runs Knative with ClusterDomainClaims (no auto-create), so the
  # claim is part of the manifest too.
  - domain-mapping.yaml
  - ghcr-pull-secret.sops.yaml

components:
  - ../../components/postgres
  - ../../components/postgres-pooler

patches:
  - target:
      kind: HelmRelease
      name: marrakesh
    # JSON6902 throughout: the app env list must be REPLACED wholesale (a
    # strategic merge would name-merge it with the base entries), and the
    # same style is kept for the rest of the values.
    patch: |-
      - op: replace
        path: /spec/values/services/app/image
        value:
          repository: "ghcr.io/enchantednatures/marrakesh"
          # CI-built sha-<commit> for the template-sync merge. The cluster's
          # Kyverno disallow-latest-tag policy requires a pinned tag.
          tag: "sha-61e5b61"
          imagePullSecrets:
            - name: ghcr-pull-secret
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          # Scale-to-zero; cold starts are acceptable for this service.
          minScale: 0
          maxScale: 3
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      # Replaces the base env list; must keep every entry the app needs.
      # Backends: chart-managed Dragonfly (cache), external RustFS (S3),
      # Tempo (OTLP), chart-managed Redpanda (Kafka), CNPG via the PgBouncer
      # pooler.
      - op: replace
        path: /spec/values/services/app/env
        value:
          - name: APP_ENV
            value: "development"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            value: "redis://marrakesh-dragonfly.marrakesh.svc.cluster.local:6379"
          - name: APP__S3__ENDPOINT
            value: "http://rustfs-service.networking.svc.cluster.local:9000"
          - name: APP__S3__BUCKET
            value: "marrakesh"
          - name: APP__S3__REGION
            value: "us-east-1"
          # The home cluster replicates the RustFS backup credentials into every
          # namespace as pg-rustfs-backup-secret (Kyverno generating policy).
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: pg-rustfs-backup-secret
                key: aws-access-key-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: pg-rustfs-backup-secret
                key: aws-secret-access-key
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://tempo-distributor.monitoring.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "marrakesh"
          - name: APP__TELEMETRY__LOG_LEVEL
            value: "debug"
          - name: RUST_LOG
            value: "debug,hyper=info,tower=info"
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "marrakesh-postgres-app"
                key: uri
          # Route the sqlx pool through the PgBouncer Pooler service instead
          # of <cluster>-rw (host swap only; credentials come from the URI).
          - name: APP__POSTGRES__HOST
            value: "marrakesh-postgres-rw-pooler"
          # Managed Redpanda: the chart publishes the internal listener on
          # port 9093 (not the external 9092).
          - name: APP__KAFKA__BROKER_URL
            value: "marrakesh-kafka:9093"
      # Dedicated Dragonfly cache rendered by the ksvc chart (Dragonfly CR
      # named marrakesh-dragonfly; the operator creates the matching Service).
      # `add` (not `replace`) because the base HelmRelease has no dragonfly key.
      - op: add
        path: /spec/values/dragonfly
        value:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          snapshot:
            enabled: false
          pdb:
            minAvailable: 0
            maxUnavailable: 1
      - op: replace
        path: /spec/values/kafka/sources/events/consumers
        value: 1
      - op: replace
        path: /spec/values/kafka/sources/events/initialOffset
        value: earliest

  # Per-env CloudNativePG sizing (the component base carries prod-leaning
  # defaults). The base already carries pod resources and the ceph-block
  # StorageClass, so only the instance count and Barman layout are patched.
  - target:
      kind: Cluster
      name: "marrakesh-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      # Barman layout convention on this cluster: all app backups share the
      # `cloudnative-pg` bucket, namespaced per server via serverName.
      - op: add
        path: /spec/plugins/0/parameters/serverName
        value: "marrakesh-v1"

  # Backup storage adapted to the home cluster's external RustFS
  # (rustfs-service.networking:9000) with the Kyverno-replicated
  # pg-rustfs-backup-secret. Per-server prefix keeps retention scoped to
  # marrakesh-v1 objects only.
  - target:
      kind: ObjectStore
      name: "marrakesh-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/configuration/endpointURL
        value: "http://rustfs-service.networking.svc.cluster.local:9000"
      - op: replace
        path: /spec/configuration/destinationPath
        value: "s3://cloudnative-pg/"
      - op: replace
        path: /spec/configuration/s3Credentials
        value:
          accessKeyId:
            name: pg-rustfs-backup-secret
            key: aws-access-key-id
          secretAccessKey:
            name: pg-rustfs-backup-secret
            key: aws-secret-access-key
      - op: replace
        path: /spec/retentionPolicy
        value: "7d"

  # PgBouncer pooler instance count plus the cluster-wide istio
  # dataplane-mode label the other poolers carry. The base already carries the
  # pgbouncer container resources required by Kyverno.
  - target:
      kind: Pooler
      name: "marrakesh-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: add
        path: /spec/template/metadata
        value:
          labels:
            istio.io/dataplane-mode: none
