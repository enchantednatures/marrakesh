apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marrakesh

resources:
  - ../../base
  - namespace.yaml
  # Kyverno generates a default-deny NetworkPolicy into every new namespace;
  # app namespaces on this cluster ship an allow-all policy to lift it
  # (same shape as home-automation / lakehouse).
  - networkpolicy.yaml
  - ghcr-pull-secret.sops.yaml

components:
  - ../../components/postgres
  - ../../components/postgres-pooler

patches:
  - target:
      kind: HelmRelease
      name: marrakesh
    # JSON6902 throughout: the app env list must be REPLACED wholesale (a
    # strategic merge would name-merge it with the base entries), and the
    # same style is kept for the rest of the values.
    patch: |-
      # Knative >=1.23 rejects valueFrom.fieldRef env vars; the ksvc chart's
      # DLQ service hardcodes POD_NAME/POD_NAMESPACE via fieldRef. Strip the
      # env list post-render — the event_display image does not need them.
      - op: add
        path: /spec/postRenderers
        value:
          - kustomize:
              patches:
                - target:
                    kind: Service
                    name: marrakesh-events-dlq
                  patch: |-
                    - op: replace
                      path: /spec/template/spec/containers/0/env
                      value: []
      - op: replace
        path: /spec/values/services/app/image
        value:
          repository: "ghcr.io/enchantednatures/marrakesh"
          tag: "sha-b51a320"
          imagePullSecrets:
            - name: ghcr-pull-secret
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          minScale: 0
          maxScale: 3
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      # Replaces the base env list; must keep every entry the app needs.
      # Backends: chart-managed Dragonfly (cache), external MinIO (S3),
      # Tempo (OTLP), shared Redpanda (Kafka), CNPG via the PgBouncer pooler.
      - op: replace
        path: /spec/values/services/app/env
        value:
          - name: APP_ENV
            value: "development"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            value: "redis://marrakesh-dragonfly.marrakesh.svc.cluster.local:6379"
          - name: APP__S3__ENDPOINT
            value: "http://minio-service.networking.svc.cluster.local:9768"
          - name: APP__S3__BUCKET
            value: "marrakesh"
          - name: APP__S3__REGION
            value: "us-east-1"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: pg-backup-secret
                key: aws-access-key-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: pg-backup-secret
                key: aws-secret-access-key
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://tempo-distributor.monitoring.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "marrakesh"
          - name: APP__TELEMETRY__LOG_LEVEL
            value: "debug"
          - name: RUST_LOG
            value: "debug,hyper=info,tower=info"
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "marrakesh-postgres-app"
                key: uri
          # Route the sqlx pool through the PgBouncer Pooler service instead
          # of <cluster>-rw (host swap only; credentials come from the URI).
          - name: APP__POSTGRES__HOST
            value: "marrakesh-postgres-rw-pooler"
          - name: APP__KAFKA__BROKER_URL
            value: "redpanda-cluster.redpanda.svc.cluster.local:9092"
      # Dedicated Dragonfly cache rendered by the ksvc chart (Dragonfly CR
      # named marrakesh-dragonfly; the operator creates the matching Service).
      - op: replace
        path: /spec/values/dragonfly
        value:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          snapshot:
            enabled: false
          pdb:
            minAvailable: 0
            maxUnavailable: 1
      - op: replace
        path: /spec/values/kafka/sources/events/bootstrapServers
        value:
          - "redpanda-cluster.redpanda.svc.cluster.local:9092"
      - op: replace
        path: /spec/values/kafka/sources/events/consumers
        value: 1
      - op: replace
        path: /spec/values/kafka/sources/events/initialOffset
        value: earliest

  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "marrakesh-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      # The cluster's Kyverno require-pod-resources policy rejects pods
      # without requests/limits — including the CNPG bootstrap job and the
      # instance pod, which inherit spec.resources.
      - op: add
        path: /spec/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      # Barman layout convention on this cluster: all app backups share the
      # `cloudnative-pg` bucket, namespaced per server via serverName.
      - op: add
        path: /spec/plugins/0/parameters/serverName
        value: "marrakesh-v1"
  # Backup storage adapted to the home cluster's external MinIO
  # (minio-service.networking:9768) with the Kyverno-replicated
  # pg-backup-secret. Per-server prefix keeps retention scoped to
  # marrakesh-v1 objects only.
  - target:
      kind: ObjectStore
      name: "marrakesh-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/configuration/endpointURL
        value: "http://minio-service.networking.svc.cluster.local:9768"
      - op: replace
        path: /spec/configuration/destinationPath
        value: "s3://cloudnative-pg/"
      - op: replace
        path: /spec/configuration/s3Credentials
        value:
          accessKeyId:
            name: pg-backup-secret
            key: aws-access-key-id
          secretAccessKey:
            name: pg-backup-secret
            key: aws-secret-access-key
      - op: replace
        path: /spec/retentionPolicy
        value: "7d"

  # PgBouncer pooler instance count + explicit container resources (Kyverno
  # require-pod-resources rejects the operator's resource-less default), and
  # the cluster-wide istio dataplane-mode label the other poolers carry.
  - target:
      kind: Pooler
      name: "marrakesh-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/template
        value:
          metadata:
            labels:
              istio.io/dataplane-mode: none
          spec:
            containers:
              - name: pgbouncer
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
