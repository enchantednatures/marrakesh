apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: marrakesh
  namespace: marrakesh
spec:
  interval: 10m
  chart:
    spec:
      chart: ./deploy/chart
      sourceRef:
        kind: GitRepository
        name: marrakesh
        namespace: flux-system
      reconcileStrategy: Revision
  
  # Knative >=1.23 rejects valueFrom.fieldRef env vars; the ksvc chart's DLQ
  # service hardcodes POD_NAME/POD_NAMESPACE via fieldRef. Strip the env list
  # post-render — the event_display image does not need them.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: "marrakesh-events-dlq"
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env
                value: []
  
  values:
    global:
      fullnameOverride: "marrakesh"
      labels:
        app.kubernetes.io/part-of: "marrakesh"

    # Named the services key `app` (non-empty) because kafka.sources.*.sink must
    # reference a services key and the ksvc chart rejects an empty sink. An empty
    # nameOverride makes the Knative Service name exactly fullnameOverride.
    services:
      app:
        nameOverride: ""
        image:
          repository: "ghcr.io/enchantednatures/marrakesh"
          tag: "latest"  # {"$imagepolicy": "flux-system:marrakesh:tag"}
          
          # Private registry credentials (see deploy/overlays/dev for the
          # SOPS-encrypted Secret and `make` targets).
          imagePullSecrets:
            - name: ghcr-pull-secret
          
        scaling:
          minScale: 1
          maxScale: 10
          target: 100
          containerConcurrency: 100
          timeoutSeconds: 300
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        probes:
          liveness:
            path: /health/live
            port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readiness:
            path: /health/ready
            port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        env:
          - name: APP_ENV
            value: "production"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            valueFrom:
              secretKeyRef:
                name: "marrakesh-secrets"
                key: redis-url
          
          # Object storage is backed by the chart-created ObjectBucketClaim
          # "<project>-app-data". The cluster's bucket provisioner publishes:
          #   - Secret   "<project>-app-data" -> AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
          #   - ConfigMap "<project>-app-data" -> BUCKET_HOST / BUCKET_PORT / BUCKET_NAME
          # both in the release namespace.
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: "marrakesh-app-data"
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "marrakesh-app-data"
                key: AWS_SECRET_ACCESS_KEY
          # BUCKET_HOST/BUCKET_PORT must be declared BEFORE APP__S3__ENDPOINT:
          # Kubernetes expands $(VAR) references using earlier env entries only.
          - name: BUCKET_HOST
            valueFrom:
              configMapKeyRef:
                name: "marrakesh-app-data"
                key: BUCKET_HOST
          - name: BUCKET_PORT
            valueFrom:
              configMapKeyRef:
                name: "marrakesh-app-data"
                key: BUCKET_PORT
          - name: APP__S3__ENDPOINT
            value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
          - name: APP__S3__BUCKET
            valueFrom:
              configMapKeyRef:
                name: "marrakesh-app-data"
                key: BUCKET_NAME
          - name: APP__S3__REGION
            value: "us-east-1"
          
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "marrakesh"
          
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "marrakesh-postgres-app"
                key: uri
          
          # Route the sqlx pool through the PgBouncer Pooler service. The
          # CNPG `uri` secret always points at <cluster>-rw, so the override
          # swaps the host while keeping credentials from that same secret.
          # The pooler hostname must be in the Cluster's
          # spec.certificates.serverAltDNSNames for verify-full to pass.
          - name: APP__POSTGRES__HOST
            value: "marrakesh-postgres-rw-pooler"
          
          
          # Chart-managed Kafka: Redpanda exposes a same-namespace Service
          # named "<project>-kafka" on 9093; Strimzi exposes the bootstrap
          # Service "<project>-kafka-kafka-bootstrap" on the plaintext 9092.
          - name: APP__KAFKA__BROKER_URL
            value: "marrakesh-kafka:9093"
          
        
        # PostgreSQL server CA certificate. Generated and rotated automatically
        # by the CloudNativePG operator (secret <cluster>-ca, key ca.crt);
        # mounted at the path config/*.toml expects (ssl_root_cert_path).
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/secrets/pg-ca
            readOnly: true
        volumes:
          - name: postgres-ca
            secret:
              secretName: "marrakesh-postgres-ca"
              items:
                - key: ca.crt
                  path: ca.crt
        

    
    kafka:
      
      # Managed mode renders a Strimzi or Redpanda cluster plus a Knative Kafka
      # Broker and Trigger. The chart derives the Kafka bootstrap address from
      # the cluster name/namespace, so neither the sources nor the broker config
      # may set `bootstrapServers`; with the Broker enabled the KafkaSource sinks
      # to the Broker (a Trigger routes to services.app), so `sink` must not be
      # set.
      cluster:
        enabled: true
        provider: "redpanda"
        name: "marrakesh-kafka"
        replicas: 1
        storage:
          size: "10Gi"
          # Empty falls back to the cluster's default StorageClass.
          storageClassName: "ceph-block"
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "2.5Gi"
        tls:
          enabled: false
        auth:
          type: none
        topics:
          create: true
          partitions: 3
        
        redpanda:
          # Kyverno clusters commonly reject the operator's privileged tuning
          # init container and pods without regular-container resources. Disable
          # tuning and size every generated container explicitly. See
          # deploy/kyverno/policyexception.yaml for the matching exception.
          extraClusterSpec:
            resources:
              requests:
                cpu: "500m"
                memory: "2Gi"
              limits:
                cpu: "2"
                memory: "2.5Gi"
            config:
              cluster:
                auto_create_topics_enabled: true
            console:
              enabled: false
            monitoring:
              enabled: false
            auth:
              sasl:
                enabled: false
            statefulset:
              initContainers:
                tuning:
                  tune_aio_events: false
                  apply_host_tuners: false
                configurator:
                  resources:
                    requests:
                      cpu: "10m"
                      memory: "64Mi"
                    limits:
                      memory: "128Mi"
              podTemplate:
                spec:
                  containers:
                    - name: sidecar
                      resources:
                        requests:
                          cpu: "10m"
                          memory: "256Mi"
                        limits:
                          memory: "512Mi"
              sideCars:
                resources:
                  requests:
                    cpu: "10m"
                    memory: "256Mi"
                  limits:
                    memory: "512Mi"
            post_install_job:
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
            post_upgrade_job:
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
        
      broker:
        enabled: true
        config:
          topicPartitions: 3
        delivery:
          retry: 5
          backoffPolicy: exponential
          backoffDelay: "PT1S"
      triggers:
        events:
          subscriber: "app"
          delivery:
            retry: 5
            backoffPolicy: exponential
            backoffDelay: "PT1S"
        
      
      sources:
        events:
          topic: "events"
          consumerGroup: "marrakesh-consumers"
          
          consumers: 3
          initialOffset: latest
          
          delivery:
            retry: 5
            backoffPolicy: exponential
            backoffDelay: "PT1S"
          dlq:
            enabled: true
            image:
              repository: "gcr.io/knative-releases/knative.dev/eventing/cmd/event_display"
              tag: "v1.23.0"
            scaling:
              minScale: 0
              maxScale: 2
            resources:
              requests:
                cpu: "50m"
                memory: "32Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
        
    

    
