[package]
name = "marrakesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Hunter Casten <huntercasten@icloud.com>"]
description = "Rust microservice template for Knative + FluxCD"
license = "MIT"

[[bin]]
name = "marrakesh"
path = "src/main.rs"

[workspace]
# The first service is the root package; shared crates live under crates/.
# Additional services are appended explicitly to this list by `make add-service`
# (a `services/*` glob would fail while services/ contains only README.md).
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.41", features = ["full"] }


# Web Framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "propagate-header"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
figment = { version = "0.10", features = ["toml", "env", "test"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# CloudEvents support (private Kellnr registry; see docs/CRATES.md)
axum-cloudevents = { version = "0.1", registry = "kellnr" }

# Observability - Tracing
tracing = "0.1"

# Observability - OpenTelemetry
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.31"

# B3 Propagation (Critical for Knative)
opentelemetry-zipkin = { version = "0.31", default-features = false, features = ["reqwest-client"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Redis (no pool - multiplexed connection)
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# UUID generation (for request IDs, event IDs)
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[dependencies]

# Async Runtime
tokio = { workspace = true }

# Web Framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
figment = { workspace = true }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Rate Limiting
governor = "0.8"
tower_governor = "0.7"

# OpenAPI
utoipa = { workspace = true }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# CloudEvents support (private Kellnr registry)
axum-cloudevents = { workspace = true }

# Shared infrastructure (config, state, observability, middleware, health,
# Kafka publisher, startup bootstrap). Features mirror the template flags.
service-core = { path = "crates/service-core", features = [
  "postgres",
  "s3",
  "kafka",
] }

# Observability - Tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"

# Observability - OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }

# B3 Propagation (Critical for Knative)
opentelemetry-zipkin = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Redis (no pool - multiplexed connection)
redis = { workspace = true }


# Time handling (Kafka event timestamps and demo event construction)
chrono = { version = "0.4", features = ["serde"] }


sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "chrono", "json"] }



# Object Storage (S3-compatible via OpenDAL)
opendal = { version = "0.55", default-features = false, features = ["services-s3"] }


# UUID generation (for request IDs, event IDs)
uuid = { workspace = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = "1.0"
once_cell = "1.0"

[dev-dependencies]
axum-test = "17"
tokio-test = "0.4"
# PostgreSQL integration testing
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json"] }
# Property-based testing
proptest = "1.0"
# Contract testing
pact_consumer = "1.4"
pact_models = "1.3"
# HTTP client for contract testing
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Benchmarking
criterion = { version = "0.5", features = ["async_tokio"] }
figment = { workspace = true }

# Build dependencies
[build-dependencies]
cargo-chef = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Benchmark configuration
[[bench]]
name = "handler_benchmarks"
harness = false
