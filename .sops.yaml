# SOPS configuration for secret encryption
# Uses Age encryption for GitOps-friendly secret management
#
# Setup:
# 1. Generate Age key: age-keygen -o age.key
# 2. Add public key to SOPS_AGE_RECIPIENTS environment variable
# 3. Encrypt secrets: sops -e -i deploy/base/object-storage-secret.yaml
# 4. Configure FluxCD to decrypt: Use sops.decryption in Kustomization

creation_rules:
  # Encrypt Kubernetes secrets only (`*.sops.yaml` suffix, data/stringData
  # values only — metadata stays readable so diffs remain reviewable).
  # The age recipient matches the `sops-age` secret in flux-system on the
  # home cluster (same key used by the HomeCluster and porygon repos).
  - path_regex: .*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: age10vdnx33zyesr04jeeepdungzmzhj3572pz9ccev3zsj6dxhvz49slagxdv
